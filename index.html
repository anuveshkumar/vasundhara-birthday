<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f0e7">
  <title>Happy Birthday Vasundhara</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero" id="top">
    <nav class="hero-nav" aria-label="Main navigation">
      <a href="#gallery">GALLERY</a>
      <a href="#for-you">A LITTLE NOTE</a>
      <span class="botanical-mark" aria-hidden="true">♧</span>
    </nav>
    <div class="hero-copy">
      <p class="script-title">Happy Birthday</p>
      <h1>Vasundhara</h1>
      <div class="flourish" aria-hidden="true"><span></span><i>❧</i></div>
      <p class="hero-wish">MAY YOU GET TO EXPERIENCE<br>ALL THE BEAUTY LIFE HAS TO OFFER</p>
    </div>
    <a class="scroll-cue" href="#gallery" aria-label="Scroll to the photo gallery"><span class="scroll-icon">↓</span><span>SCROLL</span></a>
  </header>

  <main>
    <section class="gallery-section" id="gallery">
      <div class="gallery-heading">
        <span class="leaf-doodle" aria-hidden="true">❧</span>
        <h3></h3>
        <div class="heading-line" aria-hidden="true"></div>
        <p>FLOWERS, LEAVES,<br>AND BEAUTIFUL YOU</p>
      </div>
      <div class="gallery" id="photoGallery" aria-label="Photo gallery"></div>
    </section>

    <section class="closing" id="for-you">
      <div class="closing-flower" aria-hidden="true">♧</div>
      <p class="closing-script">The thread of your life cuts through us all<br>You're math, the beautiful</p>
      <p class="closing-label">Vasundhara. Vasundhara. Vasundhara.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
